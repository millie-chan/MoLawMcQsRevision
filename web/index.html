<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>430法律刷題</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="430刷題" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>430法律刷題</h1>
      <p class="subtitle">Leitner 間隔複習</p>
    </header>

    <!-- loading -->
    <section id="loading" class="panel">
      <p>題庫載入中…</p>
    </section>

    <!-- error -->
    <section id="error" class="panel hidden">
      <p class="error-msg" id="error-msg"></p>
      <button id="btn-retry" class="btn">重試</button>
    </section>

    <!-- 計劃選擇 -->
    <section id="plan-select" class="panel hidden">
      <h2>選擇學習計劃</h2>
      <p class="hint">選定天數後系統會自動分組，每組依 Leitner 間隔複習。</p>
      <div class="plan-buttons">
        <button class="plan-card" data-plan="15">
          <strong>15 天</strong>
          <span>7 組 · 複習 4 次</span>
          <span class="plan-detail">間隔 1 / 2 / 4 / 8 天</span>
        </button>
        <button class="plan-card" data-plan="30">
          <strong>30 天</strong>
          <span>14 組 · 複習 5 次</span>
          <span class="plan-detail">間隔 1 / 2 / 4 / 8 / 16 天</span>
        </button>
        <button class="plan-card" data-plan="60">
          <strong>60 天</strong>
          <span>28 組 · 複習 6 次</span>
          <span class="plan-detail">間隔 1 / 2 / 4 / 8 / 16 / 32 天</span>
        </button>
      </div>

      <div class="plan-extra">
        <button id="btn-import-empty" class="btn btn-ghost">📥 匯入進度</button>
        <button id="btn-install-empty" class="btn btn-ghost hidden">📱 加到主屏幕</button>
      </div>
    </section>

    <!-- 組列表 -->
    <section id="home" class="panel hidden">
      <div class="home-header">
        <div>
          <h2>學習進度</h2>
          <p class="hint" id="home-summary"></p>
        </div>
        <div class="home-actions">
          <button id="btn-install" class="btn btn-ghost hidden" title="加到主屏幕">📱</button>
          <button id="btn-export" class="btn btn-ghost" title="匯出進度">📤</button>
          <button id="btn-import" class="btn btn-ghost" title="匯入進度">📥</button>
          <button id="btn-reset" class="btn btn-ghost">重置</button>
        </div>
      </div>

      <div class="dashboard">
        <div class="dash-row">
          <div class="dash-percent" id="dash-percent">0%</div>
          <div class="dash-meta" id="dash-meta"></div>
        </div>
        <div class="dash-bar">
          <div class="dash-bar-fill" id="dash-bar"></div>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-value" id="stat-streak">0</div>
          <div class="stat-label">連續學習天數</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">累計答題</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-accuracy">—</div>
          <div class="stat-label">總正確率</div>
        </div>
      </div>

      <div class="search-box">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="🔍 搜尋題目或科目…"
          autocomplete="off"
        />
      </div>

      <div id="search-results" class="search-results hidden"></div>
      <div id="group-list"></div>
    </section>

    <!-- 答題 -->
    <section id="quiz" class="panel hidden">
      <div class="quiz-meta">
        <span>第 <strong id="q-index">1</strong> / <strong id="q-total">0</strong> 題</span>
        <span>答對 <strong id="q-correct">0</strong> 題</span>
      </div>
      <p class="q-source" id="q-source"></p>
      <h2 class="question" id="q-text"></h2>
      <ul class="options" id="q-options"></ul>
      <div class="feedback hidden" id="q-feedback"></div>
      <div class="explanation hidden" id="q-explanation"></div>
      <div class="quiz-actions">
        <button id="btn-next" class="btn btn-primary hidden">下一題</button>
      </div>
    </section>

    <!-- 本組結果 -->
    <section id="result" class="panel hidden">
      <h2 id="r-verdict">本組結果</h2>
      <p>答對 <strong id="r-correct">0</strong> / <strong id="r-total">0</strong></p>
      <p>正確率 <strong id="r-accuracy">0%</strong></p>
      <p class="hint" id="r-next"></p>

      <div id="wrong-section" class="wrong-section hidden">
        <h3 class="section-title">❌ 錯題回顧 (<span id="wrong-count">0</span>)</h3>
        <div id="wrong-list" class="wrong-list"></div>
      </div>

      <div class="quiz-actions">
        <button id="btn-redo-wrong" class="btn hidden">重做錯題</button>
        <button id="btn-back-home" class="btn btn-primary">返回組列表</button>
      </div>
    </section>

    <!-- 題目詳情 Modal -->
    <div id="q-detail-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close" aria-label="關閉">×</button>
        <p class="modal-source" id="modal-source"></p>
        <h3 class="modal-question" id="modal-question"></h3>
        <ul class="modal-options" id="modal-options"></ul>
        <div class="modal-explanation hidden" id="modal-explanation"></div>
      </div>
    </div>

    <!-- 隱藏的文件選擇器 -->
    <input type="file" id="file-input" accept=".json,application/json" hidden />
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
