<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leitner 刷題</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Leitner 刷題</h1>
      <p class="subtitle">階段 1：題庫載入 + 線性答題</p>
    </header>

    <!-- 載入中 -->
    <section id="loading" class="panel">
      <p>題庫載入中…</p>
    </section>

    <!-- 載入錯誤 -->
    <section id="error" class="panel hidden">
      <p class="error-msg" id="error-msg"></p>
      <button id="btn-retry" class="btn">重試</button>
    </section>

    <!-- 開始畫面 -->
    <section id="start" class="panel hidden">
      <p>共 <strong id="total-count">0</strong> 題。</p>
      <button id="btn-start" class="btn btn-primary">開始作答</button>
    </section>

    <!-- 答題畫面 -->
    <section id="quiz" class="panel hidden">
      <div class="quiz-meta">
        <span>第 <strong id="q-index">1</strong> / <strong id="q-total">0</strong> 題</span>
        <span>答對 <strong id="q-correct">0</strong> 題</span>
      </div>

      <h2 class="question" id="q-text"></h2>

      <ul class="options" id="q-options"></ul>

      <div class="feedback hidden" id="q-feedback"></div>

      <div class="quiz-actions">
        <button id="btn-next" class="btn btn-primary hidden">下一題</button>
      </div>
    </section>

    <!-- 結果畫面 -->
    <section id="result" class="panel hidden">
      <h2>本輪結果</h2>
      <p>答對 <strong id="r-correct">0</strong> / <strong id="r-total">0</strong></p>
      <p>正確率 <strong id="r-accuracy">0%</strong></p>
      <button id="btn-restart" class="btn btn-primary">再答一次</button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
